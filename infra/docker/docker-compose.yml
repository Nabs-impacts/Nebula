services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebula_user
      POSTGRES_PASSWORD: nebula_password
      POSTGRES_DB: nebula_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula_user -d nebula_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../Backend/.env
    environment:
      DATABASE_URL: postgresql://nebula_user:nebula_password@postgres:5432/nebula_db
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
