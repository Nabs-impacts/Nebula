# Reverse proxy d’exemple pour un déploiement sur un VPS.
# Adapter server_name, les chemins de certificats et l’adresse du frontend.
server {
    listen 80;
    server_name nebula.tenora-digital.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nebula.tenora-digital.store;

    ssl_certificate /etc/letsencrypt/live/nebula.tenora-digital.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nebula.tenora-digital.store/privkey.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
